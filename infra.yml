---
- name: Deploy Container Infrastructure Stack
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  vars:
    services:
      web:
        replicas: 2
        image: nginx:alpine
      database:
        image: mariadb:10.11
        ports: "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: simplepass123
      api:
        image: nginx:alpine
        ports: "8000:80"
    web_replicas_list:
      - name: "0"
        port: "8080:80"
      - name: "1"
        port: "8081:80"
    database_list:
      - key: "database"
        value:
          image: "mariadb:10.11"
          ports: "3306:3306"
          env:
            MYSQL_ROOT_PASSWORD: simplepass123
    api_list:
      - key: "api"
        value:
          image: "nginx:alpine"
          ports: "8000:80"
  tasks:
    - name: Cleanup containers
      shell: podman rm -f web-* database api || true
      ignore_errors: yes

    - name: Create network
      containers.podman.podman_network:
        name: infra-net

    - name: Deploy web replicas
      containers.podman.podman_container:
        name: "web-{{ item.name }}"
        image: "{{ services.web.image }}"
        state: started
        ports: "{{ item.port }}"
        networks:
          - name: infra-net
        restart_policy: always
        detach: yes
      loop: web_replicas_list
      ignore_errors: yes

    - name: Deploy database
      containers.podman.podman_container:
        name: "{{ item.key }}"
        image: "{{ item.value.image }}"
        state: started
        ports: "{{ item.value.ports }}"
        networks:
          - name: infra-net
        env: "{{ item.value.env | default({}) }}"
        restart_policy: always
        detach: yes
      loop: database_list
      ignore_errors: yes

    - name: Deploy api
      containers.podman.podman_container:
        name: "{{ item.key }}"
        image: "{{ item.value.image }}"
        state: started
        ports: "{{ item.value.ports }}"
        networks:
          - name: infra-net
        restart_policy: always
        detach: yes
      loop: api_list
      ignore_errors: yes
