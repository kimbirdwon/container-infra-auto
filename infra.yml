---
- name: Deploy Container Infrastructure Stack (Ubuntu Docker)
  hosts: localhost
  connection: local
  gather_facts: no
  become: yes
  vars:
    services:
      web:
        replicas: 2
        image: nginx:alpine
      database:
        image: mariadb:10.11
        container_port: "3306"
        host_port: "3306"
        env:
          MYSQL_ROOT_PASSWORD: simplepass123
      api:
        image: nginx:alpine
        container_port: "80"
        host_port: "8000"
  tasks:
    - name: Cleanup containers
      shell: docker rm -f web-* database api || true
      ignore_errors: yes

    - name: Create network
      docker_network:
        name: infra-net

    - name: Deploy web replicas
      docker_container:
        name: "web-{{ item.0 }}"
        image: "{{ services.web.image }}"
        state: started
        ports: ["{{ '808' ~ item.1 ~ ':80' }}"]
        networks:
          - name: infra-net
        restart_policy: always
      loop:
        - [ "0", "0" ]
        - [ "1", "1" ]
      ignore_errors: yes

    - name: Deploy database
      docker_container:
        name: database
        image: "{{ services.database.image }}"
        state: started
        ports: ["{{ services.database.host_port }}:{{ services.database.container_port }}"]
        networks:
          - name: infra-net
        env: "{{ services.database.env }}"
        restart_policy: always
      ignore_errors: yes

    - name: Deploy api
      docker_container:
        name: api
        image: "{{ services.api.image }}"
        state: started
        ports: ["{{ services.api.host_port }}:{{ services.api.container_port }}"]
        networks:
          - name: infra-net
        restart_policy: always
      ignore_errors: yes
