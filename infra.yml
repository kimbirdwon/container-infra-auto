---
- name: Deploy Container Infrastructure Stack
  hosts: localhost
  connection: local
  gather_facts: no
  become: no
  vars:
    services:
      web:
        replicas: 2
        image: nginx:alpine
        ports: "8080:80"
      database:
        image: mariadb:10.11
        ports: "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: simplepass123
      api:
        image: nginx:alpine
        ports: "8000:80"
  tasks:
    - name: Cleanup containers
      shell: podman rm -f web-* database api || true
      ignore_errors: yes

    - name: Create network
      containers.podman.podman_network:
        name: infra-net

    - name: Deploy web replicas
      containers.podman.podman_container:
        name: "web-{{ _ansible_index }}"
        image: "{{ services.web.image }}"
        state: started
        ports: "{{ '808' ~ (_ansible_index + 1) | string ~ ':80' if _ansible_index > 0 else '8080:80' }}"
        networks:
          - name: infra-net
        restart_policy: always
        detach: yes
      loop: "{{ services.web.replicas | int }}"
      loop_control:
        index_var: _ansible_index
      ignore_errors: yes

    - name: Deploy database
      containers.podman.podman_container:
        name: "{{ item.key }}"
        image: "{{ item.value.image }}"
        state: started
        ports: "{{ item.value.ports }}"
        networks:
          - name: infra-net
        env: "{{ item.value.env | default({}) }}"
        restart_policy: always
        detach: yes
      loop: "{{ {'database': services.database} | dict2items }}"
      ignore_errors: yes

    - name: Deploy api
      containers.podman.podman_container:
        name: "{{ item.key }}"
        image: "{{ item.value.image }}"
        state: started
        ports: "{{ item.value.ports }}"
        networks:
          - name: infra-net
        restart_policy: always
        detach: yes
      loop: "{{ {'api': services.api} | dict2items }}"
      ignore_errors: yes
