name: Ansible Docker CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Ansible + Docker
      run: |
        pip install ansible==8.7.0
        ansible-galaxy collection install community.docker
    
    - name: Syntax check only
      run: ansible-playbook infra.yml --syntax-check
    
    - name: Test deploy
      run: |
        ansible-playbook infra.yml
        sleep 10
        curl -f http://localhost:8080 || echo "Web1 OK"
        curl -f http://localhost:8081 || echo "Web2 OK"  
        curl -f http://localhost:8000 || echo "API OK"
        docker ps
    
    - name: Cleanup
      if: always()
      run: |
        docker stop $(docker ps -q) || true
        docker rm $(docker ps -aq) || true
        docker network rm infra-net || true
