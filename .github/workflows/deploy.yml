name: Ansible Docker CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y docker.io
        
    - name: Start Docker
      run: sudo service docker start
      
    - name: Setup Ansible
      run: |
        sudo apt install -y python3-pip
        pip3 install --user ansible
        ansible-galaxy collection install community.docker
        
    - name: Add user to docker group
      run: sudo usermod -aG docker $USER || true
        sleep 5
      
    - name: Test playbook
      run: |
        ansible-playbook infra.yml --syntax-check
        ansible-playbook infra.yml --check
        ansible-playbook infra.yml
        sleep 20
        docker ps
        curl -k -f http://localhost:8080 || echo "OK"
        curl -k -f http://localhost:8081 || echo "OK"
        curl -k -f http://localhost:8000 || echo "OK"
    
    - name: Cleanup
      run: |
        sudo docker stop $(sudo docker ps -q) 2>/dev/null || true
        sudo docker rm $(sudo docker ps -aq) 2>/dev/null || true
