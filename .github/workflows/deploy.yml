name: Ansible Docker CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python & Ansible
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install ansible docker
        ansible-galaxy collection install community.docker --force
        
    - name: Install Docker CLI
      run: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        
    - name: Syntax & Dry run
      run: |
        ansible-playbook infra.yml --syntax-check
        ansible-playbook infra.yml --check
        
    - name: Deploy test
      run: |
        ansible-playbook infra.yml
        sleep 20
        docker ps || echo "Containers running"
    
    - name: Cleanup
      run: docker rm -f $(docker ps -aq) 2>/dev/null || true
