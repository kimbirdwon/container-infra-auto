name: Ansible Docker Infra CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ansible + Docker
      run: |
        pip install ansible==8.7.0  # core 2.16相当
        ansible-galaxy collection install community.docker

    - name: Lint Ansible
      run: ansible-lint infra.yml

    - name: Dry-run Infra
      run: ansible-playbook infra.yml --check --syntax-check

    - name: Test Docker Deploy
      run: |
        docker network create infra-net || true
        ansible-playbook infra.yml

    - name: Verify Services
      run: |
        curl -f localhost:8080 || exit 1
        curl -f localhost:8081 || exit 1
        curl -f localhost:8000 || exit 1
        docker ps
